name = "pantry-planner-proxy"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[vars]
UPSTREAM_URL = "https://api.anthropic.com"
# Backstop: the whole service stops for the day once this much Claude cost (millionths of a dollar) is spent. 10,000,000 = $10.
GLOBAL_DAILY_LIMIT_MICROS = "10000000"
# New accounts one IP address may create per day.
REGISTRATIONS_PER_IP_PER_DAY = "3"

# Play Integrity at sign-up: "off", "log" (check and log, never refuse) or "enforce". Start with "log".
INTEGRITY_MODE = "log"
PACKAGE_NAME = "app.pantrypal.mealplanner"

[[durable_objects.bindings]]
name = "USER_QUOTA"
class_name = "UserQuota"

[[durable_objects.bindings]]
name = "COUNTERS"
class_name = "Counters"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserQuota", "Counters"]

# Secrets (set with `wrangler secret put NAME`, never written here):
#   ANTHROPIC_API_KEY  your Claude key
#   TOKEN_SECRET       long random string that signs the per-install tokens
#   ADMIN_SECRET       long random string for the /admin endpoints
#   GOOGLE_SA_JSON     Google service-account key JSON (Play Integrity decoding); `wrangler secret put GOOGLE_SA_JSON < key.json`
