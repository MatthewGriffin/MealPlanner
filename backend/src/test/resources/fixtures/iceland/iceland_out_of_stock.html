<!DOCTYPE html>
<html lang="en">
<head>
    <title>Iceland Out of Stock Product</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Product",
      "name": "Iceland Fresh Strawberries 400g",
      "sku": "ice_strawberries_400g",
      "offers": {
        "@type": "Offer",
        "priceCurrency": "GBP",
        "price": "2.00",
        "availability": "https://schema.org/OutOfStock"
      }
    }
    </script>
</head>
<body>
    <div class="product-card" data-product-id="ice_strawberries_400g">
        <h2 class="product-name">Iceland Fresh Strawberries 400g</h2>
        <span class="product-price">£2.00</span>
        <span class="stock-badge out-of-stock">Out of Stock</span>
    </div>
</body>
</html>
